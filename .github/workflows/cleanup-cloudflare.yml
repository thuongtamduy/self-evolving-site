name: Cleanup Cloudflare

# One-off: deletes the Cloudflare Pages project "growsdaily" (all deployments)
# and the D1 database "growsdaily-db". Type "growsdaily" to confirm.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type growsdaily to delete the Pages project and its D1 database"
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT: growsdaily
      DB_NAME: growsdaily-db
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "$PROJECT" ]; then
            echo "::error::Confirmation does not match \"$PROJECT\". Nothing was deleted."; exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are missing."; exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Delete the Pages project
        run: |
          set +e
          out=$(npx --yes wrangler@4 pages project delete "$PROJECT" --yes 2>&1); code=$?
          echo "$out"
          if [ $code -eq 0 ]; then echo "✓ Deleted Pages project \"$PROJECT\"."
          elif echo "$out" | grep -qiE "not found|does not exist|8000007"; then echo "✓ Pages project \"$PROJECT\" was already gone."
          else echo "::error::Could not delete the Pages project."; exit 1; fi

      - name: Delete the D1 database
        run: |
          set +e
          out=$(npx --yes wrangler@4 d1 delete "$DB_NAME" -y 2>&1); code=$?
          echo "$out"
          if [ $code -eq 0 ]; then echo "✓ Deleted D1 database \"$DB_NAME\"."
          elif echo "$out" | grep -qiE "not found|couldn't find|does not exist|7404"; then echo "✓ D1 database \"$DB_NAME\" does not exist."
          elif echo "$out" | grep -qiE "Authentication error|10000"; then
            echo "::warning::The token has no D1 permission, so the database was most likely never created. Nothing to delete."
          else echo "::error::Could not delete the D1 database."; exit 1; fi
