name: Cleanup Cloudflare

# One-off: deletes the Cloudflare Pages project (and all its deployments).
# Run it from the Actions tab and type the project name to confirm.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the Pages project name to delete (growsdaily)"
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT: growsdaily
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "$PROJECT" ]; then
            echo "::error::Confirmation does not match \"$PROJECT\". Nothing was deleted."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are missing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete the Pages project
        run: |
          set +e
          out=$(npx --yes wrangler@4 pages project delete "$PROJECT" --yes 2>&1)
          code=$?
          echo "$out"
          if [ $code -eq 0 ]; then
            echo "✓ Deleted Cloudflare Pages project \"$PROJECT\". $PROJECT.pages.dev is gone."
          elif echo "$out" | grep -qiE "not found|does not exist|8000007"; then
            echo "✓ Project \"$PROJECT\" does not exist (already deleted)."
          else
            echo "::error::Could not delete the project. See the output above."
            exit 1
          fi
